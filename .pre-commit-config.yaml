# Local pre-commit checks mirroring the required CI jobs in
# .github/workflows/test.yaml (Constitution Principle X — Verifiable
# Security). Catches SAST/secret findings before push, not just in CI.
#
# Setup (once per clone):
#   pip install pre-commit && pre-commit install
#
# Requires: Go toolchain on PATH (gitleaks hook builds itself via `language:
# golang`) and `npm ci` already run under frontend/ (eslint hook assumes
# node_modules exists).
repos:
  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        files: ^(backend|ocr-service)/app/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: eslint-security
        name: ESLint security (frontend)
        entry: bash -c 'cd frontend && npm run lint:security'
        language: system
        files: ^frontend/.*\.(ts|vue)$
        pass_filenames: false
