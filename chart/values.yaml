# NOTE: keep at 1 — the backend runs an in-process scheduler (retention,
# oil-price cron) and an in-memory rate limiter; multiple replicas would run
# the jobs multiple times.
replicaCount: 1

backend:
  image:
    repository: ghcr.io/dmkif/zaehl-o-mat-backend
    pullPolicy: IfNotPresent
    tag: ""  # defaults to Chart.appVersion
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  env:
    DEBUG: "false"
    UPLOAD_PATH: /data/uploads
    OIL_PRICE_SOURCE: heizoel-aktuell
  # Reference an existing secret with keys:
  #   DATABASE_URL, JWT_SECRET_KEY,
  #   OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_DISCOVERY_URL,
  #   OIDC_REDIRECT_URI, SUPERADMIN_USER, SUPERADMIN_PASSWORD
  existingSecret: ""
  # Mount an existing secret as files to /run/secrets/ (one key per file).
  # pydantic-settings reads these automatically — env vars take precedence.
  secretVolume:
    enabled: false
    secretName: ""  # Name of k8s Secret to project as files

ollama:
  enabled: false
  # URL of an external Ollama instance (leave empty to disable LLM OCR)
  url: ""
  model: "gemma4:e4b"

frontend:
  image:
    repository: ghcr.io/dmkif/zaehl-o-mat-frontend
    pullPolicy: IfNotPresent
    tag: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

ingress:
  enabled: true
  className: traefik
  host: zaehlomat.apps.schmulzer.de
  tls: true
  certIssuer: letsencrypt-prod
  # external-dns publish target (e.g. the cluster's own stable DNS name) -
  # leave empty to skip DNS annotations entirely.
  externalDnsTarget: ""

persistence:
  enabled: true
  storageClass: longhorn
  size: 5Gi

# Own StatefulSet, not a bitnami/community chart dependency - avoids
# fighting another chart's image/securityContext assumptions. Set
# enabled: false and fill in externalDatabase.host to point at an
# external Postgres instead.
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: "18-trixie"
    pullPolicy: IfNotPresent
  auth:
    database: zaehlwart
    username: zaehlwart
    existingSecret: zaehl-o-mat-db-secret
    secretPasswordKey: POSTGRES_PASSWORD
  persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

externalDatabase:
  host: ""

networkPolicy:
  # Off by default: enabling this without checking ingressFrom first will
  # silently cut off all ingress traffic instead of protecting anything -
  # the selector must actually match your Traefik pods/namespace. Once
  # enabled: postgresql only accepts traffic from this chart's own backend,
  # and backend/frontend only accept traffic matching ingressFrom.
  enabled: false
  ingressFrom:
    namespaceSelector: {}
    podSelector: {}
