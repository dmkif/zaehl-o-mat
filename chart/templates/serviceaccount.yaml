{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zaehl-o-mat.serviceAccountName" . }}
  labels:
    {{- include "zaehl-o-mat.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app never talks to the Kubernetes API - no reason to hand every pod
# a token for it.
automountServiceAccountToken: false
{{- end }}
