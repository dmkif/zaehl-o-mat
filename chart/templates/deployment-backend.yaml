apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zaehl-o-mat.fullname" . }}-backend
  labels:
    {{- include "zaehl-o-mat.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "zaehl-o-mat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "zaehl-o-mat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "zaehl-o-mat.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: {{ include "zaehl-o-mat.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Values.backend.existingSecret | default (printf "%s-secret" (include "zaehl-o-mat.fullname" .)) }}
          env:
            {{- range $k, $v := .Values.backend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.ollama.enabled }}
            - name: OLLAMA_URL
              value: {{ .Values.ollama.url | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.ollama.model | quote }}
            {{- end }}
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
            {{- if .Values.backend.secretVolume.enabled }}
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            # Process-only check: a DB outage must fail readiness, not trigger
            # restart loops via liveness.
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: uploads
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "zaehl-o-mat.fullname" . }}-uploads
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.backend.secretVolume.enabled }}
        - name: secrets
          secret:
            secretName: {{ .Values.backend.secretVolume.secretName }}
        {{- end }}
