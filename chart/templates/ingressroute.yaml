{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "zaehl-o-mat.fullname" . }}
  labels:
    {{- include "zaehl-o-mat.labels" . | nindent 4 }}
  {{- if .Values.ingress.externalDnsTarget }}
  annotations:
    # external-dns' traefik-proxy source only reads the target annotation
    # on IngressRoute objects, not hostname - without this the record is
    # never published even though the route works fine.
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.host }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.ingress.externalDnsTarget }}
    external-dns.alpha.kubernetes.io/ttl: "300"
  {{- end }}
spec:
  entryPoints:
    - websecure
  routes:
    # Bulk-scan streams its result as SSE. Traefik's `buffering` middleware also
    # buffers the response, which would break the stream, so this route has no
    # body-limit middleware: the backend refuses oversized bodies itself
    # (BodyLimitMiddleware, MAX_BULK_TOTAL_BYTES) before the form is parsed.
    - match: Host(`{{ .Values.ingress.host }}`) && Path(`/api/ocr/bulk-scan`)
      kind: Rule
      middlewares:
        - name: {{ include "zaehl-o-mat.fullname" . }}-security-headers
      services:
        - name: {{ include "zaehl-o-mat.fullname" . }}-backend
          port: 8000
    # Other API traffic → backend, request body capped by Traefik (F-012)
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api`) && !Path(`/api/ocr/bulk-scan`)
      kind: Rule
      middlewares:
        - name: {{ include "zaehl-o-mat.fullname" . }}-security-headers
        - name: {{ include "zaehl-o-mat.fullname" . }}-body-limit
      services:
        - name: {{ include "zaehl-o-mat.fullname" . }}-backend
          port: 8000
    # Everything else → frontend SPA (all backend endpoints live under /api,
    # including /api/auth/* and /api/uploads/*)
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      middlewares:
        - name: {{ include "zaehl-o-mat.fullname" . }}-security-headers
      services:
        - name: {{ include "zaehl-o-mat.fullname" . }}-frontend
          port: 8080
  {{- if .Values.ingress.tls }}
  tls:
    certResolver: {{ .Values.ingress.certIssuer }}
  {{- end }}
{{- end }}
