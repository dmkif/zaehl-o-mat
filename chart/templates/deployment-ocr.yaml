{{- if .Values.ocr.enabled }}
{{- if and (not .Values.ocr.existingSecret) (not .Values.ocr.allowUnauthenticated) }}
{{- fail "ocr.enabled needs ocr.existingSecret (a Secret with key OCR_API_KEY, e.g. `openssl rand -base64 32`; the backend and the OCR service both read it), or set ocr.allowUnauthenticated=true to run the OCR service without authentication (F-030)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zaehl-o-mat.fullname" . }}-ocr
  labels:
    {{- include "zaehl-o-mat.labels" . | nindent 4 }}
    app.kubernetes.io/component: ocr
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "zaehl-o-mat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ocr
  template:
    metadata:
      labels:
        {{- include "zaehl-o-mat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ocr
    spec:
      serviceAccountName: {{ include "zaehl-o-mat.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ocr
          image: {{ include "zaehl-o-mat.ocrImage" . }}
          imagePullPolicy: {{ .Values.ocr.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8100
          {{- if or .Values.ocr.env .Values.ocr.existingSecret }}
          env:
            {{- range $k, $v := .Values.ocr.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.ocr.existingSecret }}
            # Same Secret/key the backend reads; /scan and /serial require it as Bearer token.
            - name: OCR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ocr.existingSecret }}
                  key: {{ .Values.ocr.secretApiKeyKey }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /health is unauthenticated on purpose (probes); /scan and /serial
          # require the Bearer token OCR_API_KEY (F-030).
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ocr.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
