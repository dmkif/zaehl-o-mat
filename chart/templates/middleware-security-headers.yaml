{{- if .Values.ingress.enabled }}
# Same security headers the docker-compose nginx proxy sets — the Kubernetes
# path must not be weaker than the compose path.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "zaehl-o-mat.fullname" . }}-security-headers
  labels:
    {{- include "zaehl-o-mat.labels" . | nindent 4 }}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: "same-origin"
    customResponseHeaders:
      X-Permitted-Cross-Domain-Policies: "none"
      Cross-Origin-Opener-Policy: "same-origin"
      Cross-Origin-Resource-Policy: "same-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
      Content-Security-Policy: >-
        default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:; connect-src 'self' blob:; font-src 'self';
        frame-ancestors 'none';
{{- end }}
