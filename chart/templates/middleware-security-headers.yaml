{{- if .Values.ingress.enabled }}
# Same security headers the docker-compose nginx proxy sets (nginx.conf), plus
# HSTS (only meaningful over TLS). Keep both header sets in sync (F-041).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "zaehl-o-mat.fullname" . }}-security-headers
  labels:
    {{- include "zaehl-o-mat.labels" . | nindent 4 }}
spec:
  headers:
    {{- with .Values.ingress.hsts }}
    stsSeconds: {{ int64 .seconds }}
    stsIncludeSubdomains: {{ .includeSubdomains }}
    stsPreload: {{ .preload }}
    {{- end }}
    forceSTSHeader: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: "same-origin"
    customResponseHeaders:
      X-Permitted-Cross-Domain-Policies: "none"
      Cross-Origin-Opener-Policy: "same-origin"
      Cross-Origin-Resource-Policy: "same-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
      Content-Security-Policy: >-
        default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:; connect-src 'self' blob:; font-src 'self';
        object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';
{{- end }}
