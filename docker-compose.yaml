services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zaehlwart
      POSTGRES_USER: zaehlwart
      POSTGRES_PASSWORD: zaehlwart
      # postgres:18+ images refuse to start with data directly at the
      # volume mount root ("unused mount/volume" check, since they now
      # expect a pg_ctlcluster-style versioned layout) — a subdirectory
      # under the mount avoids that check. Matches the existing Helm
      # chart's statefulset-postgresql.yaml PGDATA convention.
      PGDATA: /var/lib/postgresql/data/pgdata
    # Guards the PGDATA change above: without this, an operator with an
    # existing pre-18 db-data volume who just runs `up -d --build` (instead
    # of scripts/pg-migrate/migrate.sh) would get a *silent*, empty new
    # database at the new pgdata/ subdirectory — their real data is still
    # physically on the volume, untouched, but the app would look
    # completely empty. Refuse loudly instead, the same way postgres:18
    # already refuses loudly when PGDATA is left at the old default.
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /var/lib/postgresql/data/PG_VERSION ] && [ ! -d /var/lib/postgresql/data/pgdata ]; then
          echo "ERROR: found an existing PostgreSQL data directory at the old," >&2
          echo "pre-18 layout (/var/lib/postgresql/data/PG_VERSION) but no" >&2
          echo "migrated pgdata/ subdirectory yet. Refusing to silently" >&2
          echo "initialize a new, empty database over your existing data." >&2
          echo "Run scripts/pg-migrate/migrate.sh --target=compose first --" >&2
          echo "see specs/002-postgres-18-migration/quickstart.md." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaehlwart"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    # CDI device access for NVIDIA GPU.
    # If startup fails with "no such file or directory" for a DRI device,
    # regenerate the CDI spec on the host:
    #   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    devices:
      - nvidia.com/gpu=all

  # Optional — EasyOCR fallback. LLM (Ollama, above) is the primary and
  # recommended extraction method; OCR is not required for the app to work.
  # Comment this whole service out (and OCR_URL below) to run without it.
  ocr:
    build: ./ocr-service
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    environment:
      DATABASE_URL: postgresql://zaehlwart:zaehlwart@db:5432/zaehlwart
      JWT_SECRET_KEY: local-dev-secret-change-in-prod
      SUPERADMIN_USER: admin
      SUPERADMIN_PASSWORD: admin123
      UPLOAD_PATH: /data/uploads
      OIL_PRICE_SOURCE: heizoel-aktuell
      APP_BASE_URL: http://localhost:5173
      DEBUG: "true"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: "qwen3-vl:8b"
      # Optional — leave empty (or remove) to run without the `ocr` service above.
      OCR_URL: http://ocr:8100
      # OIDC optional – leer lassen deaktiviert SSO
      OIDC_CLIENT_ID: ""
      OIDC_CLIENT_SECRET: ""
      OIDC_DISCOVERY_URL: ""
      OIDC_REDIRECT_URI: "http://localhost:5173/api/auth/callback"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    command: >
      /bin/sh -c
      "RESOLVER=$$(awk '/^nameserver/{print $$2; exit}' /etc/resolv.conf)
      && export RESOLVER
      && envsubst '$$RESOLVER' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"

volumes:
  db-data:
  uploads:
  ollama-data:
