name: Browser E2E

# Feature 013: Playwright (Chromium) against the security rig behind a production-like HTTPS edge
# (security/rig/browser_proxy.py). Separate, initially NOT a required check: make it required in the
# branch protection once it has proven stable.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            security/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Run the browser tests
        env:
          E2E_PW_DEPS: "1"          # system libraries for Chromium
          SEC_PYTHON: python3
        run: scripts/e2e.sh

      - name: Upload report and rig logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            security/rig/.last-logs
          retention-days: 7
