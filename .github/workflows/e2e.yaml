name: Browser E2E

# Feature 013: Playwright (Chromium) against the security rig behind a production-like HTTPS edge
# (security/rig/browser_proxy.py). Required status check on main (branch protection, since 0.8.0):
# runs on every PR to main, so there must be no path filter here.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            security/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Run the browser tests
        env:
          E2E_PW_DEPS: "1"          # system libraries for Chromium
          SEC_PYTHON: python3
        run: scripts/e2e.sh

      - name: Upload report and rig logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            security/rig/.last-logs
          retention-days: 7
