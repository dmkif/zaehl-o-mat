name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (DEP-08): no job needs more than reading the repository.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1 libgl1 libglib2.0-0

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: "sqlite://"
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
          UPLOAD_PATH: "/tmp/zaehl-o-mat-test-uploads"
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 14

  backend-sast:
    name: Backend SAST (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run bandit
        working-directory: backend
        run: |
          pip install bandit==1.9.4
          bandit -r app

  ocr-service-tests:
    name: OCR service tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ocr-service/requirements.txt

      - name: Install Python dependencies
        working-directory: ocr-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run tests
        working-directory: ocr-service
        run: python -m pytest tests/ -v

  ocr-service-sast:
    name: OCR service SAST (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run bandit
        working-directory: ocr-service
        run: |
          pip install bandit==1.9.4
          bandit -r app

  frontend-types:
    name: Frontend type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Security lint (eslint-plugin-security)
        working-directory: frontend
        run: npm run lint:security

      - name: Unit tests
        working-directory: frontend
        run: npm test

  security-scan:
    name: Dependency vulnerability scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: pip-audit (runtime requirements)
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r backend/requirements.txt
          pip-audit -r ocr-service/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  chart-scan:
    name: Chart lint and misconfiguration scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: helm lint and template
        run: |
          helm lint chart
          helm template zaehl-o-mat chart > /tmp/rendered.yaml

      - name: Trivy config scan (chart)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: chart
          severity: HIGH,CRITICAL
          exit-code: "1"
