server {
    listen 80;

    # Security headers. Keep in sync with chart/templates/middleware-security-headers.yaml
    # (F-041): the chart sends the same set plus HSTS, which only makes sense behind TLS.
    # X-XSS-Protection is intentionally absent (deprecated, can introduce XSS in old browsers).
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Allow uploads up to 15 MB (phone photos can be 3-8 MB; backend limit is 10 MB)
    client_max_body_size 15m;

    # Resolver is set at container startup from /etc/resolv.conf (works for Docker + Podman)
    resolver ${RESOLVER} valid=10s ipv6=off;

    # Bulk-scan SSE stream — must not be buffered
    location /api/ocr/bulk-scan {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_redirect     http://backend:8000/ /;
        proxy_redirect     http://localhost/    /;
        proxy_buffering    off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # API → Backend
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_redirect     http://backend:8000/ /;
        proxy_redirect     http://localhost/    /;

        # OCR with LLM inference can take up to 3 minutes
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # Frontend → static-web-server
    location / {
        set $frontend http://frontend:8080;
        proxy_pass         $frontend;
        proxy_set_header   Host $host;
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    # SPA fallback: return index.html for client-side routes
    location @spa_fallback {
        set $frontend http://frontend:8080;
        proxy_pass         $frontend/index.html;
        proxy_set_header   Host $host;
    }
}
