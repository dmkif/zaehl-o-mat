server {
    listen 80;

    # Use Podman internal DNS so hostnames are re-resolved after container restarts
    # Podman: 10.89.0.1 | Docker: 127.0.0.11
    resolver 10.89.0.1 valid=10s ipv6=off;

    # API → Backend
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     http://backend:8000/ /;
        proxy_redirect     http://localhost/    /;
    }

    # Frontend → static-web-server
    location / {
        set $frontend http://frontend:8080;
        proxy_pass         $frontend;
        proxy_set_header   Host $host;
    }
}
